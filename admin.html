<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador | NAY-UX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #09090b;
            background-image: radial-gradient(circle at 50% 0%, #18181c 0%, #09090b 65%, #050507 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #e4e4e7;
        }
        .navbar-admin {
            background: rgba(12, 12, 15, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid #27272a;
        }
        .nav-logo {
            height: 36px;
            width: auto;
            filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.08));
        }
        .role-tag {
            background: #18181b;
            border: 1px solid #52525b;
            color: #f4f4f5;
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            padding: 0.28rem 0.65rem;
            border-radius: 3px;
            font-weight: 600;
        }
        .panel-dark {
            background: #111114;
            border: 1px solid #27272a;
            border-radius: 6px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
        }
        .stat-card {
            background: linear-gradient(180deg, #16161a 0%, #0e0e11 100%);
            border: 1px solid #27272a;
            border-left: 3px solid #a1a1aa;
            border-radius: 6px;
        }
        .custom-input, .custom-select {
            background-color: #18181b;
            border: 1px solid #3f3f46;
            border-radius: 4px;
            color: #f4f4f5;
            font-size: 0.88rem;
        }
        .custom-input::placeholder {
            color: #a1a1aa;
        }
        .custom-input:focus, .custom-select:focus {
            background-color: #1f1f23;
            border-color: #d4d4d8;
            color: #ffffff;
            box-shadow: 0 0 0 0.15rem rgba(244, 244, 245, 0.14);
            outline: none;
        }
        .btn-nayux-bevel {
            padding: 0.48rem 0.9rem;
            font-weight: 600;
            font-size: 0.82rem;
            letter-spacing: 1px;
            color: #f4f4f5;
            background: linear-gradient(180deg, #323236 0%, #1c1c1f 100%);
            border: 1px solid #71717a;
            border-radius: 4px;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: filter 0.2s ease, border-color 0.2s ease;
        }
        .btn-nayux-bevel:hover {
            filter: brightness(1.18);
            border-color: #d4d4d8;
            color: #ffffff;
        }
        .btn-nayux-outline {
            background: #18181b;
            border: 1px solid #52525b;
            color: #e4e4e7;
            border-radius: 4px;
            font-size: 0.82rem;
            letter-spacing: 0.6px;
            transition: all 0.2s ease;
        }
        .btn-nayux-outline:hover {
            background: #27272a;
            border-color: #d4d4d8;
            color: #ffffff;
        }
        .api-card {
            background: #121215;
            border: 1px solid #27272a;
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .api-card:hover {
            transform: translateY(-3px);
            border-color: #71717a;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.8);
        }
        .gif-wrapper {
            background: #18181b;
            height: 185px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid #27272a;
            position: relative;
        }
        .gif-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .badge-zona {
            background: #27272a;
            border: 1px solid #52525b;
            color: #f4f4f5;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .badge-equipo {
            background: #09090b;
            border: 1px solid #3f3f46;
            color: #a1a1aa;
            font-weight: 500;
        }
        .table-dark {
            --bs-table-bg: #111114;
            --bs-table-hover-bg: #18181c;
            --bs-table-border-color: #27272a;
        }
    </style>
</head>
<body onload="inicializarAdmin()">

    <nav class="navbar navbar-dark navbar-admin px-4 py-3 sticky-top">
        <div class="d-flex align-items-center gap-3">
            <img src="img/logo-nayux.png" alt="NAY-UX" class="nav-logo">
            <span class="role-tag">ADMINISTRADOR</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="text-secondary small d-none d-sm-inline">Sesión: <strong class="text-light" id="nombreUsuarioNav"></strong></span>
            <button class="btn btn-nayux-outline btn-sm px-3" onclick="cerrarSesion()">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
            </button>
        </div>
    </nav>

    <div class="container-fluid py-4 px-4">
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card stat-card p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="text-secondary small text-uppercase" style="letter-spacing: 1px;">Ejercicios Publicados</span>
                            <h3 class="fw-bold text-white mb-0 mt-1" id="statPublicados">0</h3>
                        </div>
                        <i class="bi bi-collection-play text-light fs-2 opacity-75"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card p-3" style="border-left-color: #d4d4d8;">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="text-secondary small text-uppercase" style="letter-spacing: 1px;">Base de Datos Fitness</span>
                            <h5 class="fw-bold text-light mb-0 mt-1">Catálogo Visual Activo</h5>
                        </div>
                        <i class="bi bi-database-check text-light fs-2 opacity-75"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card p-3" style="border-left-color: #71717a;">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="text-secondary small text-uppercase" style="letter-spacing: 1px;">Accesos Registrados</span>
                            <h3 class="fw-bold text-light mb-0 mt-1" id="statAccesos">1</h3>
                        </div>
                        <i class="bi bi-clock-history text-light fs-2 opacity-75"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card panel-dark">
                    <div class="card-header bg-transparent border-secondary border-opacity-25 d-flex justify-content-between align-items-center flex-wrap gap-2 py-3">
                        <h5 class="mb-0 fw-semibold text-white" style="letter-spacing: 1px;">
                            <i class="bi bi-search text-secondary me-2"></i>CATÁLOGO GLOBAL DE EJERCICIOS
                        </h5>
                        <div class="d-flex gap-2 flex-wrap">
                            <input type="text" id="buscadorAdminAPI" class="form-control form-control-sm custom-input" style="width: 195px;" placeholder="Buscar ejercicio..." onkeyup="buscarEnAPIAdmin()">
                            <select id="filtroZonaAPI" class="form-select form-select-sm custom-select" style="width: auto;" onchange="buscarEnAPIAdmin()">
                                <option value="">Todos los grupos musculares</option>
                                <option value="chest">Pecho</option>
                                <option value="back">Espalda</option>
                                <option value="upper legs">Piernas (Cuádriceps / Femoral)</option>
                                <option value="lower legs">Pantorrillas / Gemelos</option>
                                <option value="shoulders">Hombros</option>
                                <option value="upper arms">Brazos (Bíceps / Tríceps)</option>
                                <option value="lower arms">Antebrazos</option>
                                <option value="waist">Abdomen / Core</option>
                                <option value="cardio">Cardio</option>
                            </select>
                            <button class="btn btn-nayux-outline btn-sm" onclick="buscarEnAPIAdmin()" title="Recargar catálogo">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row" id="contenedorAPI"></div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card panel-dark mb-4">
                    <div class="card-header bg-transparent border-secondary border-opacity-25 d-flex justify-content-between align-items-center py-3">
                        <h6 class="mb-0 text-white fw-semibold" style="letter-spacing: 1px;">
                            <i class="bi bi-check2-square text-secondary me-1"></i> PUBLICADOS EN NAY-UX
                        </h6>
                        <span class="badge badge-zona" id="contadorCatalogo">0</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive" style="max-height: 360px;">
                            <table class="table table-dark table-hover mb-0 align-middle small">
                                <thead>
                                    <tr class="text-secondary">
                                        <th>Vista</th>
                                        <th>Ejercicio</th>
                                        <th>Zona</th>
                                        <th class="text-end">Quitar</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaCatalogoAdmin"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card panel-dark">
                    <div class="card-header bg-transparent border-secondary border-opacity-25 py-3">
                        <h6 class="mb-0 text-white fw-semibold" style="letter-spacing: 1px;">
                            <i class="bi bi-journal-text text-secondary me-1"></i> BITÁCORA DE ACCESOS
                        </h6>
                    </div>
                    <ul class="list-group list-group-flush small" id="listaBitacoraAdmin"></ul>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-secondary py-3 border-top border-secondary border-opacity-25 mt-4 small">
        NAY-UX • Sistema de Entrenamiento y Gestión
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
