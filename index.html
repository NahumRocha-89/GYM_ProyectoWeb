<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | NAY-UX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #09090b;
            background-image: radial-gradient(circle at 50% 25%, #16161a 0%, #09090b 65%, #050507 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #e4e4e7;
            margin: 0;
        }
        .login-wrapper {
            width: 100%;
            max-width: 410px;
            padding: 1.5rem;
        }
        .brand-logo {
            max-width: 310px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 6px 22px rgba(255, 255, 255, 0.08));
        }
        .login-heading {
            font-size: 1.45rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: #f4f4f5;
        }
        .custom-input {
            background-color: #18181b;
            border: 1px solid #52525b;
            border-radius: 4px;
            color: #f4f4f5;
            padding: 0.72rem 0.95rem;
            font-size: 0.95rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }
        .custom-input::placeholder {
            color: #a1a1aa;
        }
        .custom-input:focus {
            background-color: #1f1f23;
            border-color: #d4d4d8;
            color: #ffffff;
            box-shadow: 0 0 0 0.15rem rgba(244, 244, 245, 0.15);
            outline: none;
        }
        .btn-ingresar {
            position: relative;
            width: 100%;
            padding: 0.75rem 1.25rem;
            font-weight: 600;
            font-size: 0.98rem;
            letter-spacing: 1.2px;
            color: #f4f4f5;
            background: linear-gradient(180deg, #323236 0%, #1c1c1f 100%);
            border: none;
            cursor: pointer;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: filter 0.2s ease, transform 0.15s ease;
        }
        .btn-ingresar-border {
            padding: 1.5px;
            background: linear-gradient(180deg, #8e8e93 0%, #52525b 100%);
            clip-path: polygon(11px 0, 100% 0, 100% calc(100% - 11px), calc(100% - 11px) 100%, 0 100%, 0 11px);
            transition: background 0.2s ease;
        }
        .btn-ingresar-border:hover {
            background: linear-gradient(180deg, #d4d4d8 0%, #71717a 100%);
        }
        .btn-ingresar-border:hover .btn-ingresar {
            filter: brightness(1.14);
        }
        .helper-link {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }
        .helper-link:hover {
            color: #f4f4f5;
        }
        .role-pill {
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #27272a;
            background: #121215;
            color: #d4d4d8;
            font-size: 0.78rem;
        }
        .role-pill:hover {
            border-color: #71717a;
            background: #1f1f24;
            color: #ffffff;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="login-wrapper text-center">
        <!-- Logotipo NAY-UX -->
        <div class="mb-4">
            <img src="img/logo-nayux.png" alt="NAY-UX" class="brand-logo mx-auto d-block">
        </div>

        <h1 class="login-heading mb-4">INICIAR SESIÓN</h1>

        <form id="formLogin" class="text-start">
            <div class="mb-3">
                <input type="text" id="inputUser" class="form-control custom-input" placeholder="Nombre de usuario o Correo electrónico" aria-label="Nombre de usuario o Correo electrónico" required>
            </div>

            <div class="mb-4">
                <input type="password" id="inputPass" class="form-control custom-input" placeholder="Contraseña" aria-label="Contraseña" required>
            </div>

            <div class="btn-ingresar-border mb-3">
                <button type="submit" class="btn-ingresar">
                    INGRESAR
                </button>
            </div>

            <div id="errorMsg" class="alert alert-danger py-2 small fw-semibold mt-3 text-center d-none">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> Usuario o contraseña incorrectos (clave de prueba: 1234).
            </div>
        </form>

        <div class="mt-3">
            <a href="#acceso-rapido" class="helper-link d-block mb-2" data-bs-toggle="collapse" role="button" aria-expanded="false" aria-controls="acceso-rapido">
                Olvidé mi contraseña
            </a>
            <p class="small text-secondary mb-0">
                ¿No tienes cuenta? <a href="#acceso-rapido" class="text-light text-decoration-none fw-semibold" data-bs-toggle="collapse" role="button">Regístrate</a>
            </p>
        </div>

        <!-- Panel desplegable discreto para mantener los accesos de prueba funcionales sin saturar la vista -->
        <div class="collapse mt-3" id="acceso-rapido">
            <div class="pt-3 border-top border-secondary border-opacity-25">
                <p class="text-secondary small mb-2">Acceso rápido de demostración (clave: 1234):</p>
                <div class="d-flex justify-content-between gap-2">
                    <button type="button" class="btn btn-sm role-pill flex-fill" onclick="autocompletar('admin', '1234')">
                        Admin
                    </button>
                    <button type="button" class="btn btn-sm role-pill flex-fill" onclick="autocompletar('trabajador', '1234')">
                        Trabajador
                    </button>
                    <button type="button" class="btn btn-sm role-pill flex-fill" onclick="autocompletar('usuario', '1234')">
                        Usuario
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            saltarLoginSiAutenticado();
            const form = document.getElementById('formLogin');
            if (form) form.addEventListener('submit', iniciarSesion);
        });
    </script>
</body>
</html>
