<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Coach | NAY-UX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #09090b;
            background-image: radial-gradient(circle at 50% 0%, #18181c 0%, #09090b 65%, #050507 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #e4e4e7;
        }
        .navbar-coach {
            background: rgba(12, 12, 15, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #27272a;
        }
        .nav-logo { height: 36px; width: auto; }
        .role-tag {
            background: #18181b;
            border: 1px solid #52525b;
            color: #f4f4f5;
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            padding: 0.28rem 0.65rem;
            border-radius: 3px;
            font-weight: 600;
        }
        .btn-nayux-bevel {
            padding: 0.6rem 1rem;
            font-weight: 600;
            font-size: 0.88rem;
            letter-spacing: 1px;
            color: #f4f4f5;
            background: linear-gradient(180deg, #323236 0%, #1c1c1f 100%);
            border: 1px solid #71717a;
            border-radius: 4px;
            clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
        }
        .btn-nayux-outline {
            background: #18181b;
            border: 1px solid #52525b;
            color: #e4e4e7;
            border-radius: 4px;
            font-size: 0.82rem;
        }
    </style>
</head>
<body onload="verificarSesion('Trabajador')">

    <nav class="navbar navbar-dark navbar-coach px-4 py-3">
        <div class="d-flex align-items-center gap-3">
            <img src="img/logo-nayux.png" alt="NAY-UX" class="nav-logo">
            <span class="role-tag">COACH</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="text-secondary small">Staff: <strong class="text-light" id="nombreUsuarioNav"></strong></span>
            <button class="btn btn-nayux-outline btn-sm px-3" onclick="cerrarSesion()">Salir</button>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-secondary shadow-lg" style="background: #111114; border-radius: 6px;">
                    <div class="card-body p-4 text-center">
                        <span class="role-tag d-inline-block mb-3">TURNO ACTIVO</span>
                        <h3 class="fw-semibold text-white mb-2">Bienvenido a Piso — NAY-UX</h3>
                        <p class="text-secondary small mb-4">Supervisión de sala, asesoría de técnica y control operativo.</p>
                        <div class="d-grid gap-2">
                            <a href="usuario.html" onclick="sessionStorage.setItem('sesionActiva', JSON.stringify({user:'trabajador', rol:'Usuario', url:'usuario.html'}))" class="btn btn-nayux-bevel">
                                ABRIR BIBLIOTECA DE EJERCICIOS
                            </a>
                            <button class="btn btn-nayux-outline" onclick="cerrarSesion()">Cerrar Sesión</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
