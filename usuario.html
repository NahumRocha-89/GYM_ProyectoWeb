<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenamiento | NAY-UX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #09090b;
            background-image: radial-gradient(circle at 50% 0%, #18181c 0%, #09090b 65%, #050507 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #e4e4e7;
        }
        .navbar-user {
            background: rgba(12, 12, 15, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid #27272a;
        }
        .nav-logo {
            height: 36px;
            width: auto;
            filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.08));
        }
        .role-tag {
            background: #18181b;
            border: 1px solid #52525b;
            color: #f4f4f5;
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            padding: 0.28rem 0.65rem;
            border-radius: 3px;
            font-weight: 600;
        }
        .custom-input {
            background-color: #18181b;
            border: 1px solid #3f3f46;
            border-radius: 4px;
            color: #f4f4f5;
            font-size: 0.9rem;
        }
        .custom-input::placeholder {
            color: #a1a1aa;
        }
        .custom-input:focus {
            background-color: #1f1f23;
            border-color: #d4d4d8;
            color: #ffffff;
            box-shadow: 0 0 0 0.15rem rgba(244, 244, 245, 0.14);
            outline: none;
        }
        .exercise-card {
            background: #121215;
            border: 1px solid #27272a;
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .exercise-card:hover {
            transform: translateY(-3px);
            border-color: #71717a;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.8);
        }
        .gif-box {
            background: #18181b;
            height: 195px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid #27272a;
        }
        .gif-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .rutina-panel {
            background: #111114;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75);
        }
        .badge-zona {
            background: #27272a;
            border: 1px solid #52525b;
            color: #f4f4f5;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .badge-equipo {
            background: #09090b;
            border: 1px solid #3f3f46;
            color: #a1a1aa;
            font-weight: 500;
        }
        .btn-nayux-bevel {
            padding: 0.42rem 0.75rem;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.8px;
            color: #f4f4f5;
            background: linear-gradient(180deg, #323236 0%, #1c1c1f 100%);
            border: 1px solid #71717a;
            border-radius: 4px;
            clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
            transition: filter 0.2s ease, border-color 0.2s ease;
        }
        .btn-nayux-bevel:hover {
            filter: brightness(1.18);
            border-color: #d4d4d8;
            color: #ffffff;
        }
        .btn-nayux-outline {
            background: #18181b;
            border: 1px solid #52525b;
            color: #e4e4e7;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .btn-nayux-outline:hover {
            background: #27272a;
            border-color: #d4d4d8;
            color: #ffffff;
        }
    </style>
</head>
<body onload="inicializarUsuario()">

    <nav class="navbar navbar-dark navbar-user px-4 py-3 sticky-top">
        <div class="d-flex align-items-center gap-3">
            <img src="img/logo-nayux.png" alt="NAY-UX" class="nav-logo">
            <span class="role-tag">ATLETA</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="text-secondary small d-none d-sm-inline">Atleta: <strong class="text-light" id="nombreUsuarioNav"></strong></span>
            <button class="btn btn-nayux-outline btn-sm px-3" onclick="cerrarSesion()">
                <i class="bi bi-box-arrow-right me-1"></i> Salir
            </button>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="fw-semibold text-white mb-1" style="letter-spacing: 1px;">BIBLIOTECA DE ENTRENAMIENTO</h4>
                        <span class="text-secondary small">Selecciona un ejercicio para ver su ejecución y técnica</span>
                    </div>
                    <input type="text" id="buscadorUsuario" class="form-control custom-input w-auto flex-grow-1"
                        placeholder="Filtrar por ejercicio, músculo o equipo..." onkeyup="filtrarEjerciciosUsuario()">
                </div>
                <div class="row" id="gridEjerciciosUsuario"></div>
            </div>

            <div class="col-lg-4">
                <div class="card rutina-panel sticky-top" style="top: 85px;">
                    <div class="card-header bg-transparent border-secondary border-opacity-25 d-flex justify-content-between align-items-center py-3">
                        <h6 class="mb-0 text-white fw-semibold" style="letter-spacing: 1px;">
                            <i class="bi bi-list-check text-secondary me-1"></i> MI RUTINA NAY-UX
                        </h6>
                        <span class="badge badge-zona" id="contadorRutina">0</span>
                    </div>
                    <ul class="list-group list-group-flush" id="listaMiRutina"></ul>
                    <div class="card-footer bg-transparent border-secondary border-opacity-25 text-end">
                        <button class="btn btn-sm btn-nayux-outline" onclick="vaciarRutina()">Limpiar Rutina</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalDetalle" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content text-light border-secondary" style="background: #111114; border-radius: 6px;">
                <div class="modal-header border-secondary border-opacity-25">
                    <h5 class="modal-title text-white fw-semibold" id="modalTitulo">Detalle del Ejercicio</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row align-items-center">
                        <div class="col-md-5 text-center mb-3 mb-md-0">
                            <div class="rounded overflow-hidden border border-secondary border-opacity-50" style="background: #18181b;">
                                <img id="modalImg" src="" alt="Demostración del ejercicio" class="img-fluid" style="max-height: 240px; width: 100%; object-fit: cover;">
                            </div>
                        </div>
                        <div class="col-md-7">
                            <p class="mb-2"><strong>Zona Muscular:</strong> <span id="modalCategoria" class="badge badge-zona"></span></p>
                            <p class="mb-2"><strong>Músculo Principal:</strong> <span id="modalMusculo" class="text-light"></span></p>
                            <p class="mb-3"><strong>Equipamiento:</strong> <span id="modalEquipo" class="text-secondary"></span></p>
                            <h6 class="text-white fw-semibold">Pasos de Ejecución:</h6>
                            <ol class="list-group list-group-numbered small" id="modalInstrucciones"></ol>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-secondary py-3 border-top border-secondary border-opacity-25 mt-4 small">
        NAY-UX • Sistema de Entrenamiento y Gestión
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
